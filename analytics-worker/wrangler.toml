name = "nice-analytics"
main = "src/worker.js"
compatibility_date = "2026-06-12"
workers_dev = true
preview_urls = false
routes = [
  { pattern = "analytics.nice.okinawa/*", zone_name = "nice.okinawa" }
]

[triggers]
crons = ["*/15 * * * *", "18 * * * *", "0 0 * * *", "7 0 * * *", "0 0 1 * *"]

[[d1_databases]]
binding = "DB"
database_name = "nice_analytics"
database_id = "fbcc9bc2-3556-4ac4-8168-8611940114d3"

[[d1_databases]]
binding = "PROGRESS_D1"
database_name = "progress"
database_id = "bb1b2b68-ace0-4855-8b1c-2e6611c944dd"

[[kv_namespaces]]
binding = "BJT_KV"
id = "fc382800625e42b7bbfe13830dd39e82"

[[r2_buckets]]
binding = "AUDIT_ARTIFACTS"
bucket_name = "nice-audit-artifacts"

[[r2_buckets]]
binding = "BJT_BACKUPS"
bucket_name = "bjt-kv-backups"

[[r2_buckets]]
binding = "PROGRESS_BACKUP"
bucket_name = "progress-backup"

[[r2_buckets]]
binding = "PROGRESS_DB_BACKUP"
bucket_name = "progress-db-backup"

[[r2_buckets]]
binding = "PROGRESS_DB_BACKUP_PREVIEW"
bucket_name = "progress-db-backup-preview"

[[r2_buckets]]
binding = "PROGRESS_BACKUP_PREVIEW"
bucket_name = "progress-backup-preview"

[[services]]
binding = "BJT_API"
service = "bjt-worker"

[[services]]
binding = "ANALYTICS_API"
service = "nice-analytics"

[vars]
ALLOWED_ORIGIN = "https://translation.nice.okinawa"
DASHBOARD_ORIGIN = "https://db.nice.okinawa"
GSC_SITE_URLS = "sc-domain:bjt.nice.okinawa,sc-domain:kiso.nice.okinawa,sc-domain:nice.okinawa,sc-domain:progress.nice.okinawa,sc-domain:snorkel.nice.okinawa,https://translation.nice.okinawa/"
# Secret required: GSC_SERVICE_ACCOUNT_JSON.
BING_SITE_URLS = "https://bjt.nice.okinawa/,https://kiso.nice.okinawa/,https://snorkel.nice.okinawa/,https://progress.nice.okinawa/,https://nice.okinawa/,https://translation.nice.okinawa/"
# Secret required: BING_API_KEY.
# Alert mail is sent via Resend only on red states or manual admin tests.
# Secret required: RESEND_API_KEY.
ALERT_RECIPIENTS = "aboutokinawa@gmail.com"
ALERT_FROM_EMAIL = "Nice Okinawa Inquiry <noreply@nice.okinawa>"
ALERT_SUBJECT_PREFIX = ""
PATH_CHECK_ALERTS_ENABLED = "1"
DASHBOARD_ALERTS_ENABLED = "1"
AUDIT_ARTIFACTS_PREFIX = "audit/human-metrics/"
# Monthly alert-channel self-check records status only; green runs do not send email.

[env.preview]
name = "nice-analytics-t0705-12"
workers_dev = true
preview_urls = true
routes = []

[env.preview.triggers]
crons = ["*/15 * * * *"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "nice_analytics_m0727_09_preview"
database_id = "827e8987-4ce8-4a44-ae1c-938a5c052ae8"

[[env.preview.d1_databases]]
binding = "PROGRESS_D1"
database_name = "progress-otp-preview"
database_id = "1b912362-95bc-4866-b3d3-652cee57dbe4"

[[env.preview.kv_namespaces]]
binding = "BJT_KV"
id = "4a016f0e1eb94e14a08d6aa53add61e3"

[[env.preview.r2_buckets]]
binding = "AUDIT_ARTIFACTS"
bucket_name = "nice-audit-artifacts"

[[env.preview.r2_buckets]]
binding = "BJT_BACKUPS"
bucket_name = "bjt-kv-backups"

[[env.preview.r2_buckets]]
binding = "PROGRESS_BACKUP"
bucket_name = "progress-backup"

[[env.preview.r2_buckets]]
binding = "PROGRESS_DB_BACKUP_PREVIEW"
bucket_name = "progress-db-backup-preview"

[[env.preview.r2_buckets]]
binding = "PROGRESS_BACKUP_PREVIEW"
bucket_name = "progress-backup-preview"

[[env.preview.services]]
binding = "BJT_API"
service = "bjt-worker"

[[env.preview.services]]
binding = "ANALYTICS_API"
service = "nice-analytics"

[env.preview.vars]
ALLOWED_ORIGIN = "https://db-t0705-12.nice.okinawa"
DASHBOARD_ORIGIN = "https://db-t0705-12.nice.okinawa"
GSC_SITE_URLS = "sc-domain:bjt.nice.okinawa,sc-domain:kiso.nice.okinawa,sc-domain:nice.okinawa,sc-domain:progress.nice.okinawa,sc-domain:snorkel.nice.okinawa,https://translation.nice.okinawa/"
# Secret required: GSC_SERVICE_ACCOUNT_JSON.
BING_SITE_URLS = "https://bjt.nice.okinawa/,https://kiso.nice.okinawa/,https://snorkel.nice.okinawa/,https://progress.nice.okinawa/,https://nice.okinawa/,https://translation.nice.okinawa/"
# Secret required: BING_API_KEY.
# Preview uses the same Resend alert contract as production.
# Secret required: RESEND_API_KEY. Preview test mail subjects are prefixed with [TEST].
ALERT_RECIPIENTS = "aboutokinawa@gmail.com"
ALERT_FROM_EMAIL = "Nice Okinawa Inquiry <noreply@nice.okinawa>"
ALERT_SUBJECT_PREFIX = "[TEST] "
PATH_CHECK_ALERTS_ENABLED = "0"
DASHBOARD_ALERTS_ENABLED = "0"
AUDIT_ARTIFACTS_PREFIX = "audit/human-metrics/preview/"
